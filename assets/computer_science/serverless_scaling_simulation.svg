<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
    
    <!-- Router Gradient -->
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #cbd5e1; font-style: italic; }
    .text-bold { font-weight: bold; }
    .grid-line { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 0.5; }
    .data-link { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 3; }
    .active-link { fill: none; stroke: #6366f1; stroke-width: 2.5; stroke-dasharray: 8 2; }
    .flow-ball { fill: #f43f5e; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: Serverless Scaling &amp; Concurrency</text>
  <text x="35" y="65" class="subtitle">Concurrent request distribution &amp; container auto-scaling (Discrete Event queue simulator)</text>

  <!-- Ingress Traffic (Left) -->
  <text x="50" y="130" class="text-val text-bold" fill="#f43f5e">HTTP INGRESS TRAFFIC</text>
  <path d="M 50,170 Q 120,150 180,220" class="active-link" />
  <path d="M 50,250 L 180,250" class="active-link" />
  <path d="M 50,330 Q 120,350 180,280" class="active-link" />

  <!-- Requests flying on wires -->
  <circle cx="90" cy="162" r="5" class="flow-ball" />
  <circle cx="150" cy="190" r="5" class="flow-ball" />
  <circle cx="110" cy="250" r="5" class="flow-ball" />
  <circle cx="160" cy="250" r="5" class="flow-ball" />
  <circle cx="100" cy="338" r="5" class="flow-ball" />
  <circle cx="140" cy="308" r="5" class="flow-ball" />

  <!-- Gateway Router Node (Center) -->
  <rect x="180" y="210" width="80" height="80" rx="40" fill="url(#routerGrad)" />
  <text x="195" y="255" class="text-val text-bold" fill="#ffffff">GATEWAY</text>

  <!-- Serverless Function Instances (Center-Right) -->
  <path d="M 260,250 L 360,130" class="active-link" />
  <path d="M 260,250 L 360,210" class="active-link" />
  <path d="M 260,250 L 360,290" class="active-link" />
  <path d="M 260,250 L 360,370" class="data-link" />

  <!-- Container Nodes -->
  <!-- Instance 1: Warm Execution (Green) -->
  <rect x="360" y="110" width="100" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
  <circle cx="375" cy="130" r="5" fill="#10b981" filter="url(#warmGlow)" />
  <text x="390" y="134" class="text-val">λ-warm-1</text>

  <!-- Instance 2: Warm Execution (Green) -->
  <rect x="360" y="190" width="100" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
  <circle cx="375" cy="210" r="5" fill="#10b981" filter="url(#warmGlow)" />
  <text x="390" y="214" class="text-val">λ-warm-2</text>

  <!-- Instance 3: Cold Start (Orange) -->
  <rect x="360" y="270" width="100" height="40" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="2.5" />
  <circle cx="375" cy="290" r="5" fill="#f97316" filter="url(#warmGlow)" />
  <text x="390" y="294" class="text-val">λ-cold-3</text>

  <!-- Instance 4: Cold Start / Shutting Down (Gray) -->
  <rect x="360" y="350" width="100" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <circle cx="375" cy="370" r="5" fill="#475569" />
  <text x="390" y="374" class="text-val" fill="#94a3b8">λ-terminated</text>

  <!-- Scaling Curve Chart (Right) -->
  <rect x="495" y="100" width="270" height="230" rx="8" fill="#0d1117" stroke="#334155" />
  <line x1="510" y1="300" x2="750" y2="300" stroke="#8b949e" stroke-width="1.5" />
  <line x1="510" y1="130" x2="510" y2="300" stroke="#8b949e" stroke-width="1.5" />
  <line x1="510" y1="130" x2="750" y2="130" class="grid-line" />
  <line x1="510" y1="215" x2="750" y2="215" class="grid-line" />

  <!-- Scaling Plot Line -->
  <path d="M 510,300 L 550,290 L 580,180 L 610,135 L 650,150 L 680,240 L 710,290 L 740,295" class="plot-line" stroke="#a855f7" />
  <circle cx="610" cy="135" r="4" fill="#a855f7" />

  <text x="525" y="125" class="text-val" fill="#a855f7">CONCURRENCY N(t)</text>
  <text x="660" y="175" class="text-val" fill="#f97316">Scale Down lag</text>
  
  <!-- Mathematics Panel (Bottom Right) -->
  <rect x="495" y="345" width="270" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="510" y="370" class="text-val text-bold" fill="#ffffff">LITTLE'S LAW SCALING</text>
  <text x="510" y="390" class="text-math">N_active(t) = λ(t) × T_execution</text>
  <text x="510" y="415" class="text-val">Average Latency: <tspan fill="#f43f5e">142 ms</tspan> (Cold: 1.2s)</text>
  <text x="510" y="435" class="text-val">System Queue state: <tspan fill="#10b981">STABLE</tspan></text>
</svg>
