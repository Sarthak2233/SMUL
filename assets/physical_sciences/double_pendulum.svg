<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
    
    <!-- Bob Gradients -->
    <radialGradient id="bob1Grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9b9e" />
      <stop offset="100%" stop-color="#ff4b5c" />
    </radialGradient>
    <radialGradient id="bob2Grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a1c4fd" />
      <stop offset="100%" stop-color="#3b76f6" />
    </radialGradient>
    
    <!-- Energy Curves Gradients -->
    <linearGradient id="keGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="peGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="bobGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #a1b0cb; font-style: italic; }
    .text-bold { font-weight: bold; fill: #ffffff; }
    .grid-line { stroke: #30363d; stroke-dasharray: 4 4; stroke-width: 1; }
    .vector-arrow { stroke-width: 2.5; fill: none; }
    .chart-axis { stroke: #8b949e; stroke-width: 1.5; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: Chaotic Double Pendulum Dynamics</text>
  <text x="35" y="65" class="subtitle">Variables mapping &amp; energy transitions (SciPy ODE / RK45 integration)</text>

  <!-- ==================== LEFT SIDE: GEOMETRY DIAGRAM ==================== -->
  
  <!-- Grid Coordinates Origin -->
  <line x1="200" y1="90" x2="200" y2="400" class="grid-line" />
  <line x1="50" y1="160" x2="350" y2="160" class="grid-line" />
  
  <!-- Pivot Base -->
  <rect x="180" y="150" width="40" height="10" fill="#30363d" rx="2" />
  <circle cx="200" cy="160" r="5" fill="#8b949e" />
  <text x="215" y="155" class="text-math">Origin (0,0)</text>

  <!-- Rod 1 -->
  <line x1="200" y1="160" x2="270" y2="250" stroke="#ff7b72" stroke-width="3" stroke-linecap="round" />
  <text x="245" y="200" class="text-math text-bold">L1</text>
  
  <!-- Angle theta1 arc -->
  <path d="M 200,200 A 40,40 0 0,1 228,196" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="2 2" />
  <text x="215" y="215" class="text-math" fill="#ff7b72">θ₁</text>

  <!-- Bob 1 -->
  <circle cx="270" cy="250" r="16" fill="url(#bob1Grad)" filter="url(#bobGlow)" />
  <text x="300" y="255" class="text-math text-bold" fill="#ff4b5c">m₁</text>
  
  <!-- Pivot 2 -->
  <circle cx="270" cy="250" r="4" fill="#ffffff" />
  <line x1="270" y1="250" x2="270" y2="350" class="grid-line" />

  <!-- Rod 2 -->
  <line x1="270" y1="250" x2="210" y2="380" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" />
  <text x="250" y="325" class="text-math text-bold">L2</text>
  
  <!-- Angle theta2 arc -->
  <path d="M 270,290 A 40,40 0 0,1 252,289" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="2 2" />
  <text x="280" y="305" class="text-math" fill="#58a6ff">θ₂</text>

  <!-- Bob 2 -->
  <circle cx="210" cy="380" r="20" fill="url(#bob2Grad)" filter="url(#bobGlow)" />
  <text x="175" y="395" class="text-math text-bold" fill="#58a6ff">m₂</text>
  <circle cx="210" cy="380" r="4" fill="#ffffff" />

  <!-- Gesture Interaction Vector Arrow -->
  <path d="M 210,380 L 150,330" fill="none" stroke="#e1c532" stroke-width="3" marker-end="url(#arrow)" class="vector-arrow" />
  <!-- Marker definition for arrow -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#e1c532" />
    </marker>
  </defs>
  <text x="110" y="315" class="text-val" fill="#e1c532">Gesture Impulse F_applied</text>

  <!-- Damping Wind Vector -->
  <path d="M 60,260 Q 100,270 140,260" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" />
  <path d="M 70,275 Q 110,285 150,275" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" />
  <polygon points="145,260 137,256 137,264" fill="#8b949e" />
  <polygon points="155,275 147,271 147,279" fill="#8b949e" />
  <text x="60" y="250" class="subtitle">Air Resistance Damping (c)</text>

  <!-- Gravity Vector -->
  <path d="M 40,110 L 40,150" fill="none" stroke="#8b949e" stroke-width="2" />
  <polygon points="40,150 36,142 44,142" fill="#8b949e" />
  <text x="50" y="130" class="text-math">g = [0, -9.81, 0]</text>

  <!-- ==================== RIGHT SIDE: VARIABLE SCHEMAS ==================== -->
  
  <rect x="420" y="90" width="345" height="160" rx="8" fill="#141724" stroke="#30363d" stroke-width="1.5" />
  <text x="440" y="115" class="text-val text-bold" fill="#ff7b72">STATE VARIABLE SCHEMAS (y_vector)</text>
  
  <text x="440" y="140" class="text-val">y[0] : θ1  =  1.047 rad  (60.0°)</text>
  <text x="440" y="160" class="text-val">y[1] : ω1  =  0.000 rad/s</text>
  <text x="440" y="180" class="text-val">y[2] : θ2  = -0.523 rad  (-30.0°)</text>
  <text x="440" y="200" class="text-val">y[3] : ω2  =  0.500 rad/s</text>
  
  <line x1="440" y1="215" x2="745" y2="215" stroke="#30363d" />
  <text x="440" y="235" class="text-val" fill="#56d364">Time (t) = 14.382s | Step (dt) = 0.016s</text>

  <!-- ==================== ENERGY CURVES CHART ==================== -->
  
  <rect x="420" y="270" width="345" height="190" rx="8" fill="#141724" stroke="#30363d" stroke-width="1.5" />
  <text x="440" y="295" class="text-val text-bold" fill="#58a6ff">LIVE ENERGY BALANCE (Joules)</text>
  
  <!-- Axis -->
  <line x1="460" y1="420" x2="740" y2="420" class="chart-axis" />
  <line x1="460" y1="420" x2="460" y2="310" class="chart-axis" />
  <text x="740" y="435" class="subtitle" text-anchor="end">Time</text>
  <text x="450" y="310" class="subtitle" text-anchor="end">Energy (J)</text>

  <!-- Total Energy Limit Reference -->
  <line x1="460" y1="330" x2="740" y2="330" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 2" />
  <text x="735" y="325" class="text-val" fill="#8b949e" font-size="9px">Total Initial Energy E_0</text>

  <!-- Kinetic Energy Curve -->
  <path d="M 460,400 Q 500,340 540,380 T 620,410 T 700,370 T 740,390" fill="none" stroke="#ec4899" stroke-width="2" />
  <!-- Potential Energy Curve -->
  <path d="M 460,350 Q 500,410 540,370 T 620,340 T 700,380 T 740,360" fill="none" stroke="#10b981" stroke-width="2" />
  <!-- Total Energy Curve (Damping Loss) -->
  <path d="M 460,330 Q 530,335 600,340 T 740,348" fill="none" stroke="#58a6ff" stroke-width="2.5" />

  <!-- Legends -->
  <rect x="475" y="305" width="8" height="8" fill="#ec4899" />
  <text x="490" y="313" class="subtitle" font-size="10px">Kinetic (KE)</text>

  <rect x="575" y="305" width="8" height="8" fill="#10b981" />
  <text x="590" y="313" class="subtitle" font-size="10px">Potential (PE)</text>

  <rect x="675" y="305" width="8" height="8" fill="#58a6ff" />
  <text x="690" y="313" class="subtitle" font-size="10px">Total E (Damped)</text>
</svg>
