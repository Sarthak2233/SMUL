<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
    
    <!-- Mass Gradients -->
    <radialGradient id="m1Grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <radialGradient id="m2Grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>
    <radialGradient id="m3Grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Vector Marker -->
    <marker id="vectorArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #a5b4fc; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #cbd5e1; font-style: italic; }
    .text-bold { font-weight: bold; }
    .grid-line { stroke: #334155; stroke-dasharray: 5 5; stroke-width: 0.5; }
    .orbit-path { fill: none; stroke-dasharray: 4 2; stroke-width: 1.5; opacity: 0.7; }
    .vector { stroke: #fbbf24; stroke-width: 2; fill: none; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: Three-Body Gravitational Dynamics</text>
  <text x="35" y="65" class="subtitle">Chaotic trajectories &amp; gravitational force vectors (Runge-Kutta 8th-Order Adaptive solver)</text>

  <!-- Grid System -->
  <line x1="100" y1="250" x2="700" y2="250" class="grid-line" />
  <line x1="400" y1="100" x2="400" y2="420" class="grid-line" />

  <!-- Orbit Trails -->
  <!-- Body 1 (Blue) Orbit -->
  <path d="M 180,260 C 120,380 320,430 420,310 C 520,190 320,130 260,180 C 200,230 190,240 210,280" class="orbit-path" stroke="#38bdf8" />
  <!-- Body 2 (Red) Orbit -->
  <path d="M 490,170 C 580,260 620,380 430,390 C 240,400 350,220 460,250" class="orbit-path" stroke="#f43f5e" />
  <!-- Body 3 (Green) Orbit -->
  <path d="M 330,340 C 220,310 150,150 350,140 C 550,130 450,280 330,340 Z" class="orbit-path" stroke="#10b981" />

  <!-- Body 1: Blue Planet -->
  <circle cx="210" cy="280" r="16" fill="url(#m1Grad)" />
  <text x="175" y="285" class="text-math text-bold" fill="#38bdf8">m₁</text>
  
  <!-- Body 2: Red Planet -->
  <circle cx="460" cy="250" r="22" fill="url(#m2Grad)" />
  <text x="490" y="255" class="text-math text-bold" fill="#f43f5e">m₂</text>

  <!-- Body 3: Green Planet -->
  <circle cx="330" cy="340" r="12" fill="url(#m3Grad)" />
  <text x="305" y="360" class="text-math text-bold" fill="#10b981">m₃</text>

  <!-- Gravitational Vectors (Body 1 to 2, 1 to 3) -->
  <path d="M 210,280 L 290,270" class="vector" marker-end="url(#vectorArrow)" />
  <text x="235" y="260" class="text-math" fill="#fbbf24">F₁₂</text>

  <path d="M 210,280 L 250,300" class="vector" marker-end="url(#vectorArrow)" />
  <text x="210" y="320" class="text-math" fill="#fbbf24">F₁₃</text>

  <!-- Gravitational Vectors (Body 2 to 1, 2 to 3) -->
  <path d="M 460,250 L 380,260" class="vector" marker-end="url(#vectorArrow)" />
  <text x="410" y="240" class="text-math" fill="#fbbf24">F₂₁</text>

  <path d="M 460,250 L 420,280" class="vector" marker-end="url(#vectorArrow)" />
  <text x="445" y="295" class="text-math" fill="#fbbf24">F₂₃</text>

  <!-- Mathematics Panel (Bottom Right) -->
  <rect x="520" y="320" width="245" height="135" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="535" y="345" class="text-val text-bold" fill="#ffffff">SYSTEM STATE VECTOR</text>
  <text x="535" y="370" class="text-math">d²x_i / dt² = -G ∑_{j≠i} m_j (x_i - x_j) / |x_i - x_j|³</text>
  <text x="535" y="400" class="text-val">G = 6.67430e-11 N·m²/kg²</text>
  <text x="535" y="420" class="text-val">E_total = E_kin + E_pot = -1.482e3 J</text>
  <text x="535" y="440" class="text-val">System State: <tspan fill="#10b981">STABLE CHAOTIC</tspan></text>
</svg>
