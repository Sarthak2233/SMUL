<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #cbd5e1; font-style: italic; }
    .text-bold { font-weight: bold; }
    .grid-line { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 0.5; }
    .axis { stroke: #8b949e; stroke-width: 2; }
    .curve { fill: none; stroke-width: 3; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: Chemical Reaction Kinetics</text>
  <text x="35" y="65" class="subtitle">Reactant depletion &amp; product evolution (Stiffness-adapted ODE integration solver)</text>

  <!-- Concentration Curves (Left Side) -->
  <line x1="80" y1="100" x2="80" y2="400" class="axis" />
  <line x1="80" y1="400" x2="420" y2="400" class="axis" />

  <text x="45" y="95" class="text-math text-bold">Conc [M]</text>
  <text x="400" y="425" class="text-math text-bold">Time (s)</text>

  <!-- Curve [A] Reactant 1 (Pink) -->
  <path d="M 80,120 C 180,240 280,360 400,370" class="curve" stroke="#f43f5e" />
  <text x="320" y="320" class="text-math" fill="#f43f5e">[A] Reactant</text>

  <!-- Curve [B] Reactant 2 (Blue) -->
  <path d="M 80,160 C 180,270 280,370 400,375" class="curve" stroke="#38bdf8" stroke-dasharray="4 2" />
  <text x="250" y="350" class="text-math" fill="#38bdf8">[B] Reactant</text>

  <!-- Curve [C] Product (Green) -->
  <path d="M 80,380 C 180,260 280,140 400,130" class="curve" stroke="#10b981" />
  <text x="320" y="180" class="text-math" fill="#10b981">[C] Product</text>

  <!-- Right: Energy Profile Curve -->
  <rect x="490" y="100" width="280" height="230" rx="8" fill="#0d1117" stroke="#334155" />
  <line x1="510" y1="300" x2="750" y2="300" stroke="#8b949e" stroke-width="1.5" />
  <line x1="510" y1="130" x2="510" y2="300" stroke="#8b949e" stroke-width="1.5" />

  <!-- Reaction Coordinate Profile -->
  <path d="M 520,240 C 560,240 580,120 620,120 C 660,120 680,280 740,280" fill="none" stroke="#a855f7" stroke-width="3" />
  
  <!-- Labels on Profile -->
  <text x="525" y="125" class="text-val" fill="#a855f7">ENERGY BARRIER (E_a)</text>
  <text x="515" y="225" class="text-val" fill="#f43f5e">A + B</text>
  <text x="610" y="105" class="text-val" fill="#fbbf24">Transition State</text>
  <text x="715" y="265" class="text-val" fill="#10b981">C</text>

  <!-- Energy Barrier Arrow -->
  <path d="M 620,240 L 620,125" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#goldArrow)" />
  <defs>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>
  <text x="630" y="180" class="text-math" fill="#fbbf24">E_a</text>

  <!-- Mathematics Panel (Bottom Right) -->
  <rect x="490" y="345" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="505" y="370" class="text-val text-bold" fill="#ffffff">REACTION RATE LAWS</text>
  <text x="505" y="390" class="text-math">d[C]/dt = k[A][B],  k = A e^{-E_a / RT}</text>
  <text x="505" y="415" class="text-val">Rate Constant (k): <tspan fill="#a855f7">0.428 M⁻¹s⁻¹</tspan></text>
  <text x="505" y="435" class="text-val">Equilibrium K_eq: <tspan fill="#10b981">1.84e2</tspan></text>
</svg>
