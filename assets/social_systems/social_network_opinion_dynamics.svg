<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
    
    <!-- Node glows -->
    <filter id="nodeGlowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #cbd5e1; font-style: italic; }
    .text-bold { font-weight: bold; }
    .grid-line { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 0.5; }
    .network-link { fill: none; stroke: #475569; stroke-width: 1.5; }
    .strong-link { fill: none; stroke: #38bdf8; stroke-width: 3; }
    .node-pro { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
    .node-con { fill: #f43f5e; stroke: #be123c; stroke-width: 2; }
    .node-neutral { fill: #94a3b8; stroke: #475569; stroke-width: 2; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: Social Opinion Dynamics</text>
  <text x="35" y="65" class="subtitle">Polarization and belief propagation on scale-free graph topology (DeGroot consensus simulator)</text>

  <!-- Network Graph (Left Side) -->
  <!-- Links -->
  <line x1="250" y1="230" x2="150" y2="180" class="strong-link" />
  <line x1="250" y1="230" x2="160" y2="280" class="network-link" />
  <line x1="250" y1="230" x2="350" y2="210" class="strong-link" stroke="#f43f5e" />
  <line x1="250" y1="230" x2="280" y2="330" class="network-link" />
  
  <line x1="150" y1="180" x2="100" y2="130" class="network-link" />
  <line x1="150" y1="180" x2="90" y2="220" class="network-link" />
  <line x1="160" y1="280" x2="100" y2="310" class="network-link" />

  <line x1="350" y1="210" x2="410" y2="160" class="network-link" />
  <line x1="350" y1="210" x2="400" y2="270" class="network-link" />

  <!-- Nodes (Color scale representing opinion spectrum) -->
  <!-- Central Hub Node (opinion: +0.2 neutral/slight pro) -->
  <circle cx="250" cy="230" r="16" class="node-neutral" />
  
  <!-- Left Cluster: Pro-Blue opinion -->
  <circle cx="150" cy="180" r="12" class="node-pro" filter="url(#nodeGlowBlue)" />
  <circle cx="160" cy="280" r="10" class="node-pro" opacity="0.8" />
  <circle cx="100" cy="130" r="8" class="node-pro" opacity="0.6" />
  <circle cx="90" cy="220" r="8" class="node-pro" opacity="0.6" />
  <circle cx="100" cy="310" r="8" class="node-neutral" />

  <!-- Right Cluster: Con-Red opinion -->
  <circle cx="350" cy="210" r="12" class="node-con" filter="url(#nodeGlowRed)" />
  <circle cx="410" cy="160" r="8" class="node-con" opacity="0.6" />
  <circle cx="400" cy="270" r="10" class="node-con" opacity="0.8" />
  <circle cx="280" cy="330" r="8" class="node-neutral" />

  <!-- Legend -->
  <circle cx="80" cy="410" r="7" class="node-pro" />
  <text x="95" y="414" class="text-val">Agree (+1.0)</text>
  <circle cx="210" cy="410" r="7" class="node-neutral" />
  <text x="225" y="414" class="text-val">Neutral (0.0)</text>
  <circle cx="340" cy="410" r="7" class="node-con" />
  <text x="355" y="414" class="text-val">Disagree (-1.0)</text>

  <!-- Polarization Plot (Right) -->
  <rect x="490" y="100" width="280" height="230" rx="8" fill="#0d1117" stroke="#334155" />
  <line x1="510" y1="215" x2="750" y2="215" stroke="#8b949e" stroke-width="1.5" /> <!-- center y=0 -->
  <line x1="510" y1="110" x2="510" y2="320" stroke="#8b949e" stroke-width="1.5" />
  <line x1="510" y1="130" x2="750" y2="130" class="grid-line" />
  <line x1="510" y1="300" x2="750" y2="300" class="grid-line" />

  <!-- Polarization convergence paths -->
  <!-- Top group converges to +0.8 -->
  <path d="M 510,150 Q 560,170 610,195 T 750,198" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 510,120 Q 560,150 610,190 T 750,198" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <!-- Bottom group converges to -0.6 -->
  <path d="M 510,280 Q 560,260 610,230 T 750,228" fill="none" stroke="#f43f5e" stroke-width="2" />
  <path d="M 510,310 Q 560,280 610,240 T 750,228" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.5" />

  <text x="525" y="125" class="text-val" fill="#a855f7">POLARIZED EQUILIBRIUM</text>
  <text x="690" y="180" class="text-val" fill="#38bdf8">Group A</text>
  <text x="690" y="250" class="text-val" fill="#f43f5e">Group B</text>

  <!-- Mathematics Panel (Bottom Right) -->
  <rect x="490" y="345" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="505" y="370" class="text-val text-bold" fill="#ffffff">DEGROOT LEARNING MODEL</text>
  <text x="505" y="390" class="text-math">x_i(t+1) = ∑_{j=1}^N W_{ij} x_j(t)</text>
  <text x="505" y="415" class="text-val">Polarization Index: <tspan fill="#f43f5e">0.74 (High)</tspan></text>
  <text x="505" y="435" class="text-val">Convergence state: <tspan fill="#f59e0b">BIPOLAR DIVISION</tspan></text>
</svg>
