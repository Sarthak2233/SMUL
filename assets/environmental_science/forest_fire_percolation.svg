<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
    
    <!-- Glow for fire -->
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #cbd5e1; font-style: italic; }
    .text-bold { font-weight: bold; }
    .grid-line { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 0.5; }
    .tree-healthy { fill: #10b981; stroke: #064e3b; stroke-width: 0.5; }
    .tree-burning { fill: #f97316; stroke: #ea580c; stroke-width: 0.5; }
    .tree-burnt { fill: #334155; stroke: #1e293b; stroke-width: 0.5; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: Forest Fire Percolation Model</text>
  <text x="35" y="65" class="subtitle">Wildfire propagation probability &amp; phase transitions on cellular grid (Stochastic lattice simulator)</text>

  <!-- Grid Lattice (Left side) -->
  <!-- 8x8 Grid of cells -->
  <g transform="translate(80, 110)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="30" height="30" class="tree-burnt" />
    <rect x="35" y="0" width="30" height="30" class="tree-burnt" />
    <rect x="70" y="0" width="30" height="30" class="tree-burnt" />
    <rect x="105" y="0" width="30" height="30" class="tree-healthy" />
    <rect x="140" y="0" width="30" height="30" class="tree-healthy" />
    <rect x="175" y="0" width="30" height="30" class="tree-healthy" />
    <rect x="210" y="0" width="30" height="30" class="tree-healthy" />

    <!-- Row 1 -->
    <rect x="0" y="35" width="30" height="30" class="tree-burnt" />
    <rect x="35" y="35" width="30" height="30" class="tree-burnt" />
    <rect x="70" y="35" width="30" height="30" class="tree-burning" filter="url(#fireGlow)" />
    <rect x="105" y="35" width="30" height="30" class="tree-healthy" />
    <rect x="140" y="35" width="30" height="30" class="tree-healthy" />
    <rect x="175" y="35" width="30" height="30" class="tree-healthy" />
    <rect x="210" y="35" width="30" height="30" class="tree-healthy" />

    <!-- Row 2 -->
    <rect x="0" y="70" width="30" height="30" class="tree-burnt" />
    <rect x="35" y="70" width="30" height="30" class="tree-burning" filter="url(#fireGlow)" />
    <rect x="70" y="70" width="30" height="30" class="tree-burning" filter="url(#fireGlow)" />
    <rect x="105" y="70" width="30" height="30" class="tree-burning" filter="url(#fireGlow)" />
    <rect x="140" y="70" width="30" height="30" class="tree-healthy" />
    <rect x="175" y="70" width="30" height="30" class="tree-healthy" />
    <rect x="210" y="70" width="30" height="30" class="tree-healthy" />

    <!-- Row 3 -->
    <rect x="0" y="105" width="30" height="30" class="tree-burnt" />
    <rect x="35" y="105" width="30" height="30" class="tree-burnt" />
    <rect x="70" y="105" width="30" height="30" class="tree-burning" filter="url(#fireGlow)" />
    <rect x="105" y="105" width="30" height="30" class="tree-healthy" />
    <rect x="140" y="105" width="30" height="30" class="tree-healthy" />
    <rect x="175" y="105" width="30" height="30" class="tree-healthy" />
    <rect x="210" y="105" width="30" height="30" class="tree-healthy" />

    <!-- Row 4 -->
    <rect x="0" y="140" width="30" height="30" class="tree-burnt" />
    <rect x="35" y="140" width="30" height="30" class="tree-burnt" />
    <rect x="70" y="140" width="30" height="30" class="tree-burnt" />
    <rect x="105" y="140" width="30" height="30" class="tree-healthy" />
    <rect x="140" y="140" width="30" height="30" class="tree-healthy" />
    <rect x="175" y="140" width="30" height="30" class="tree-healthy" />
    <rect x="210" y="140" width="30" height="30" class="tree-healthy" />
  </g>

  <!-- Legend -->
  <rect x="80" y="380" width="15" height="15" class="tree-healthy" />
  <text x="105" y="393" class="text-val">Healthy Forest</text>
  <rect x="210" y="380" width="15" height="15" class="tree-burning" />
  <text x="235" y="393" class="text-val">Active Fire Front</text>
  <rect x="345" y="380" width="15" height="15" class="tree-burnt" />
  <text x="370" y="393" class="text-val">Burned / Ashes</text>

  <!-- Percolation Plot (Right) -->
  <rect x="490" y="100" width="280" height="230" rx="8" fill="#0d1117" stroke="#334155" />
  <line x1="510" y1="300" x2="750" y2="300" stroke="#8b949e" stroke-width="1.5" />
  <line x1="510" y1="130" x2="510" y2="300" stroke="#8b949e" stroke-width="1.5" />
  <line x1="510" y1="130" x2="750" y2="130" class="grid-line" />
  <line x1="510" y1="215" x2="750" y2="215" class="grid-line" />

  <!-- Critical Threshold S-Curve -->
  <path d="M 510,300 Q 610,300 630,215 T 750,130" fill="none" stroke="#ea580c" stroke-width="3" />
  <!-- Critical Point Pc dotted line -->
  <line x1="630" y1="130" x2="630" y2="300" class="grid-line" stroke="#8b949e" />
  <circle cx="630" cy="215" r="5" fill="#ffffff" />

  <text x="525" y="125" class="text-val" fill="#ea580c">BURN PROBABILITY P_burn</text>
  <text x="640" y="240" class="text-val" fill="#ffffff">P_c ≈ 0.592</text>

  <!-- Mathematics Panel (Bottom Right) -->
  <rect x="490" y="345" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="505" y="370" class="text-val text-bold" fill="#ffffff">PERCOLATION DYNAMICS</text>
  <text x="505" y="390" class="text-math">P(spread) = f(density, wind, slope)</text>
  <text x="505" y="415" class="text-val">Grid Density: <tspan fill="#10b981">62% (Above Pc)</tspan></text>
  <text x="505" y="435" class="text-val">Fire spread: <tspan fill="#f43f5e">CRITICAL PERCOLATION</tspan></text>
</svg>
