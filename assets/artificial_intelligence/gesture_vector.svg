<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b1a2e" />
      <stop offset="100%" stop-color="#090814" />
    </radialGradient>
    
    <!-- Neon Circle Gradients -->
    <radialGradient id="thumbGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbc2eb" />
      <stop offset="100%" stop-color="#a6c1ee" />
    </radialGradient>
    
    <radialGradient id="indexGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8fd3f4" />
      <stop offset="100%" stop-color="#84fab0" />
    </radialGradient>
    
    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #a1b0cb; font-style: italic; }
    .text-bold { font-weight: bold; fill: #ffffff; }
    
    /* Hand skeleton styling */
    .skeleton-line { stroke: #8b949e; stroke-width: 2; opacity: 0.4; }
    .skeleton-joint { fill: #8b949e; stroke: #ffffff; stroke-width: 1; }
    
    /* Target vector styling */
    .vector-force { stroke: #e1c532; stroke-width: 3.5; stroke-dasharray: none; }
    .camera-frame { fill: none; stroke: #30363d; stroke-width: 1.5; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">MediaPipe Hand Landmark Vector Mapping</text>
  <text x="35" y="65" class="subtitle">Translating normalized hand landmarks to physical force vectors (sim:command)</text>

  <!-- ==================== LEFT SIDE: HAND LANDMARKS SCHEMA ==================== -->
  
  <!-- Camera Frame Boundaries -->
  <rect x="50" y="100" width="340" height="350" rx="6" class="camera-frame" />
  <text x="60" y="120" class="subtitle" font-size="10px">Webcam viewport boundaries [0.0 to 1.0]</text>
  
  <!-- Hand skeleton drawing (simplified schema coordinate offsets) -->
  <!-- Wrist (0) -->
  <circle cx="220" cy="410" r="6" class="skeleton-joint" />
  <text x="220" y="428" class="text-val" font-size="9px">Wrist(0)</text>

  <!-- Thumb joints: 1, 2, 3, 4 -->
  <path d="M 220,410 L 170,380 L 140,340 L 125,300 L 120,270" fill="none" class="skeleton-line" />
  <circle cx="170" cy="380" r="4" class="skeleton-joint" />
  <circle cx="140" cy="340" r="4" class="skeleton-joint" />
  <circle cx="125" cy="300" r="4" class="skeleton-joint" />
  
  <!-- Thumb Tip (4) -->
  <circle cx="120" cy="270" r="8" fill="url(#thumbGrad)" filter="url(#neonGlow)" />
  <text x="90" y="260" class="text-val text-bold" fill="#a6c1ee">Thumb(4)</text>
  <text x="90" y="275" class="text-val" font-size="9px" fill="#8b949e">[x4, y4, z4]</text>

  <!-- Index joints: 5, 6, 7, 8 -->
  <path d="M 220,410 L 210,320 L 205,260 L 200,210 L 195,170" fill="none" class="skeleton-line" />
  <circle cx="210" cy="320" r="4" class="skeleton-joint" />
  <circle cx="205" cy="260" r="4" class="skeleton-joint" />
  <circle cx="200" cy="210" r="4" class="skeleton-joint" />
  
  <!-- Index Tip (8) -->
  <circle cx="195" cy="170" r="8" fill="url(#indexGrad)" filter="url(#neonGlow)" />
  <text x="215" y="165" class="text-val text-bold" fill="#84fab0">Index(8)</text>
  <text x="215" y="180" class="text-val" font-size="9px" fill="#8b949e">[x8, y8, z8]</text>

  <!-- Rest of hand finger nodes (Middle, Ring, Pinky tips for visual representation) -->
  <path d="M 220,410 L 250,330 L 260,265 L 262,210 L 265,165" fill="none" class="skeleton-line" />
  <circle cx="265" cy="165" r="4" class="skeleton-joint" />
  
  <path d="M 220,410 L 290,345 L 305,285 L 310,235 L 312,190" fill="none" class="skeleton-line" />
  <circle cx="312" cy="190" r="4" class="skeleton-joint" />

  <path d="M 220,410 L 330,370 L 350,325 L 358,280 L 362,240" fill="none" class="skeleton-line" />
  <circle cx="362" cy="240" r="4" class="skeleton-joint" />

  <!-- Palm connection joints -->
  <path d="M 170,380 L 210,320 L 250,330 L 290,345 L 330,370" fill="none" class="skeleton-line" />

  <!-- Pinch Interaction Area -->
  <!-- Pinch distance line -->
  <line x1="120" y1="270" x2="195" y2="170" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Label showing pinch distance equation -->
  <rect x="70" y="200" width="105" height="40" rx="4" fill="#121420" stroke="#ff7b72" stroke-opacity="0.5" />
  <text x="122" y="215" class="text-math" font-size="10px" fill="#ff7b72" text-anchor="middle">Pinch Distance (d)</text>
  <text x="122" y="230" class="text-val" font-size="9px" fill="#ff7b72" text-anchor="middle">d = ||Tip8 - Tip4||</text>

  <!-- ==================== RIGHT SIDE: PHYSICAL VECTOR CALCULATIONS ==================== -->
  
  <rect x="420" y="100" width="345" height="350" rx="10" fill="#121420" stroke="#30363d" stroke-width="1.5" />
  <text x="440" y="135" class="text-val text-bold" fill="#e1c532">VECTOR CALCULATION SCHEMAS</text>

  <!-- 3D coordinate system representing physical world space mapping -->
  <g transform="translate(480, 240)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="120" y2="0" stroke="#30363d" stroke-width="1.5" /> <!-- X -->
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#30363d" stroke-width="1.5" /> <!-- Y -->
    <line x1="0" y1="0" x2="-60" y2="60" stroke="#30363d" stroke-width="1.5" /> <!-- Z -->
    <text x="125" y="5" class="subtitle" font-size="10px">X (Axis)</text>
    <text x="-5" y="-95" class="subtitle" font-size="10px">Y</text>
    <text x="-70" y="70" class="subtitle" font-size="10px">Z</text>

    <!-- Simulated target object -->
    <circle cx="60" cy="-40" r="15" fill="#58a6ff" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1.5" />
    <circle cx="60" cy="-40" r="3" fill="#58a6ff" />
    <text x="60" y="-60" class="text-math" fill="#58a6ff" text-anchor="middle">Object Center (P_obj)</text>

    <!-- Target Interaction Pinch point (mapped from camera coordinates) -->
    <circle cx="10" cy="-100" r="4" fill="#ec4899" />
    <text x="10" y="-110" class="text-math" fill="#ec4899" text-anchor="middle">Mapped Finger (P_fing)</text>

    <!-- Spring Force Vector -->
    <path d="M 60,-40 L 10,-100" fill="none" stroke="#e1c532" stroke-width="2.5" marker-end="url(#gold-arrow)" class="vector-force" />
    <text x="45" y="-80" class="text-math" fill="#e1c532">Force (F)</text>
  </g>

  <defs>
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#e1c532" />
    </marker>
  </defs>

  <!-- Math equations representation box -->
  <rect x="440" y="325" width="305" height="105" rx="6" fill="#171926" stroke="#30363d" />
  
  <text x="455" y="350" class="text-val" fill="#e1c532">Force vector calculations:</text>
  <text x="455" y="375" class="text-math" font-size="12px" fill="#ffffff">
    F = K * (P_finger - P_object)
  </text>
  <text x="455" y="395" class="text-val" font-size="9px" fill="#8b949e">
    where K is virtual spring stiffness (default = 15.0 N/m)
  </text>
  <text x="455" y="415" class="text-val" font-size="9px" fill="#8b949e">
    Vector is normalized and bounded: max F = 100.0 Newtons
  </text>
</svg>
