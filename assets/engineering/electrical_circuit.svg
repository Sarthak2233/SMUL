<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0b0d16" />
    </radialGradient>
    
    <!-- Schematic Gradients -->
    <linearGradient id="sineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .text-val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #e1e4e8; }
    .text-math { font-family: 'Georgia', serif; font-size: 13px; fill: #cbd5e1; font-style: italic; }
    .text-bold { font-weight: bold; }
    .grid-line { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 0.5; }
    .circuit-wire { fill: none; stroke: #8b949e; stroke-width: 3; stroke-linecap: round; }
    .schematic-component { fill: none; stroke: #38bdf8; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .plot-line { fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .glow-dot { fill: #10b981; filter: drop-shadow(0px 0px 5px #10b981); }
  </style>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <text x="35" y="45" class="title">Scenario: RLC Circuit Transient Response</text>
  <text x="35" y="65" class="subtitle">Second-order system oscillation &amp; damping curves (Modified Nodal Analysis solver)</text>

  <!-- Left: Circuit Diagram -->
  <!-- Main loop wire -->
  <path d="M 100,280 L 100,160 L 400,160 L 400,280 M 400,320 L 400,400 L 100,400 L 100,320" class="circuit-wire" />

  <!-- Voltage Source (V) -->
  <circle cx="100" cy="300" r="20" class="schematic-component" stroke="#38bdf8" fill="#1c1f2e" />
  <path d="M 90,300 C 95,290 95,290 100,300 C 105,310 105,310 110,300" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <text x="65" y="305" class="text-math text-bold" fill="#38bdf8">V(t)</text>

  <!-- Resistor (R) -->
  <path d="M 180,160 L 200,160 L 205,150 L 215,170 L 225,150 L 235,170 L 245,150 L 255,170 L 260,160 L 280,160" class="schematic-component" />
  <text x="220" y="130" class="text-math text-bold" fill="#38bdf8">R = 10 Ω</text>

  <!-- Inductor (L) -->
  <path d="M 400,180 L 400,200 C 415,200 415,215 400,215 C 415,215 415,230 400,230 C 415,230 415,245 400,245 C 415,245 415,260 400,260 L 400,280" class="schematic-component" />
  <text x="430" y="235" class="text-math text-bold" fill="#38bdf8">L = 150 mH</text>

  <!-- Capacitor (C) -->
  <path d="M 400,300 M 380,300 L 420,300 M 380,310 L 420,310" class="schematic-component" />
  <text x="430" y="310" class="text-math text-bold" fill="#38bdf8">C = 220 µF</text>

  <!-- Ground Connection -->
  <path d="M 250,400 L 250,420 M 235,420 L 265,420 M 242,425 L 258,425 M 247,430 L 253,430" stroke="#8b949e" stroke-width="2.5" />

  <!-- Charge direction arrow -->
  <path d="M 150,185 L 180,185" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
  </defs>
  <text x="160" y="210" class="text-math" fill="#f43f5e">i(t)</text>

  <!-- Right: Oscilloscope Display -->
  <rect x="490" y="100" width="280" height="230" rx="8" fill="#0d1117" stroke="#334155" />
  <!-- Display Grid -->
  <line x1="490" y1="215" x2="770" y2="215" stroke="#21262d" stroke-width="1.5" />
  <line x1="630" y1="100" x2="630" y2="330" stroke="#21262d" stroke-width="1.5" />
  <line x1="490" y1="157.5" x2="770" y2="157.5" class="grid-line" />
  <line x1="490" y1="272.5" x2="770" y2="272.5" class="grid-line" />
  <line x1="560" y1="100" x2="560" y2="330" class="grid-line" />
  <line x1="700" y1="100" x2="700" y2="330" class="grid-line" />

  <!-- Under-damped oscillation curve (voltage V_c) -->
  <path d="M 500,215 Q 520,110 540,160 T 580,240 T 620,200 T 660,222 T 700,212 T 740,216 H 760" class="plot-line" stroke="#10b981" />
  
  <!-- Critical Damping Envelope -->
  <path d="M 500,105 C 530,115 570,180 760,214" fill="none" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1.5" />
  <path d="M 500,325 C 530,315 570,250 760,216" fill="none" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1.5" />

  <circle cx="540" cy="160" r="4" class="glow-dot" />

  <!-- Oscilloscope Labels -->
  <text x="505" y="125" class="text-val" fill="#10b981">CH1 V_c(t)</text>
  <text x="710" y="315" class="text-val" fill="#f43f5e">Envelope</text>

  <!-- Mathematics Panel (Bottom Right) -->
  <rect x="490" y="345" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="505" y="370" class="text-val text-bold" fill="#ffffff">SYSTEM MODEL (ODE)</text>
  <text x="505" y="390" class="text-math">L d²q/dt² + R dq/dt + q/C = V(t)</text>
  <text x="505" y="415" class="text-val">Damping factor (α): 33.33 rad/s</text>
  <text x="505" y="435" class="text-val">Resonant freq (ω₀): 174.08 rad/s</text>
</svg>
