  <!-- Product link 3 -->
  <line x1="750" y1="426" x2="750" y2="444" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Product link 4 -->
  <line x1="750" y1="506" x2="750" y2="524" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Product link 5 -->
  <line x1="750" y1="586" x2="750" y2="604" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

