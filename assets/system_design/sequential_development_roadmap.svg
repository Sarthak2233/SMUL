<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181922" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>
    
    <!-- Harness node gradient (Indigo/Purple) -->
    <linearGradient id="harnessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Product node gradient (Emerald/Green) -->
    <linearGradient id="productGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Card background for active/pending cards -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2030" />
      <stop offset="100%" stop-color="#12131a" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Marker definition for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
    
    <marker id="arrow-unlock" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 24px; fill: #ffffff; font-weight: 700; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #8b949e; }
    .track-header { font-family: 'Outfit', sans-serif; font-size: 18px; fill: #ffffff; font-weight: bold; }
    .node-id { font-family: 'Outfit', sans-serif; font-size: 13px; fill: #ffffff; font-weight: 800; }
    .node-title { font-family: 'Outfit', sans-serif; font-size: 13px; fill: #ffffff; font-weight: bold; }
    .node-desc { font-family: 'Inter', sans-serif; font-size: 10px; fill: #9ca3af; }
    .lock-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #f59e0b; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="1000" height="800" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.03">
    <path d="M 0,50 L 1000,50 M 0,100 L 1000,100 M 0,150 L 1000,150 M 0,200 L 1000,200 M 0,250 L 1000,250 M 0,300 L 1000,300 M 0,350 L 1000,350 M 0,400 L 1000,400 M 0,450 L 1000,450 M 0,500 L 1000,500 M 0,550 L 1000,550 M 0,600 L 1000,600 M 0,650 L 1000,650 M 0,700 L 1000,700 M 0,750 L 1000,750" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,800 M 200,0 L 200,800 M 300,0 L 300,800 M 400,0 L 400,800 M 500,0 L 500,800 M 600,0 L 600,800 M 700,0 L 700,800 M 800,0 L 800,800 M 900,0 L 900,800" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Header -->
