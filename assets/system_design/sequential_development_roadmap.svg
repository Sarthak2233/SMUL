  <!-- Unlock constraint line from H2 to P0 -->
  <path d="M 400 318 C 500 318, 500 158, 592 158" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-unlock)" />
  
  <!-- Unlock lock icon & text badge -->
