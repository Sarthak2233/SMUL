  <!-- Harness link 1 -->
  <line x1="250" y1="266" x2="250" y2="284" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Harness link 2 -->
  <line x1="250" y1="346" x2="250" y2="364" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Harness link 3 -->
  <line x1="250" y1="426" x2="250" y2="444" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

