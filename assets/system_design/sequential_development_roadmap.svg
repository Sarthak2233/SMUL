  <!-- Product link 0 -->
  <line x1="750" y1="186" x2="750" y2="204" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Product link 1 -->
  <line x1="750" y1="266" x2="750" y2="284" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Product link 2 -->
