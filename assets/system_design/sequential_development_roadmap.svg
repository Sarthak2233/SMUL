  <text x="50" y="67" class="subtitle">Sequential advancement roadmap linking verification milestones to feature unlocks</text>

  <!-- Track Headers -->
  <text x="100" y="105" class="track-header">Harness Verification Track</text>
  <text x="600" y="105" class="track-header">Product Capability Track</text>

  <!-- Draw Harness Nodes -->

