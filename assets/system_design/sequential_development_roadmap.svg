    <!-- ID badge -->
    <rect x="0" y="0" width="45" height="56" rx="8" fill="url(#harnessGrad)" />
    <text x="22" y="32" text-anchor="middle" class="node-id">H3</text>
    <!-- Content -->
    <text x="60" y="24" class="node-title">Agent stop_hook Loop</text>
    <text x="60" y="42" class="node-desc">Self-correction &amp; failure inject</text>
